<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — RAW DIGITAL WORKS</title><meta name="description" content="Contact RAW DIGITAL WORKS."><link rel="stylesheet" href="site.css">
<link rel="icon" href="logo-96.jpg"><meta property="og:image" content="logo.jpg"></head>
<body><header class="top" id="top"></header><main>

<section class="hero"><div class="wrap"><span class="eyebrow">Contact</span><h1>Talk to us</h1><p class="lead">Questions about an EA, licences or support — or join the waitlist for new releases.</p>
<form class="contact" id="cf"><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required>
<select name="topic"><option>Waitlist for new EAs</option><option>Question about an EA</option><option>Support</option><option>Other</option></select>
<textarea name="msg" rows="5" placeholder="Message" required></textarea><button class="btn primary" type="submit">Send message</button></form>
<p class="sub" style="margin-top:14px;font-size:14px">We reply within 24 hours. We never ask for your trading account password.</p></div></section>
</main><footer id="foot"></footer><script src="site.js"></script><script>
const q=new URLSearchParams(location.search).get("ea");if(q){document.querySelector("[name=msg]").value="About EA: "+q+"\n";}
document.getElementById("cf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const to=window.RDW_CONTACT_EMAIL;
if(!to){alert("Contact email is being set up. Please try again soon.");return;}
location.href="mailto:"+to+"?subject="+encodeURIComponent("[RDW] "+f.get("topic")+" — "+f.get("name"))+"&body="+encodeURIComponent(f.get("msg")+"\n\nFrom: "+f.get("name")+" <"+f.get("email")+">");};</script><script src="config.js"></script></body></html>
