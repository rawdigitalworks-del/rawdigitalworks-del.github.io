<section class="hero"><div class="wrap"><span class="eyebrow">Contact</span><h1>Talk to us</h1><p class="lead">Questions about a kit, delivery or your purchase — we reply within 24 hours.</p>
<form class="contact" id="cf"><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required>

const q=new URLSearchParams(location.search).get("ea");if(q){document.querySelector("[name=msg]").value="About: "+q+"\n";}
document.getElementById("cf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const to=window.RDW_CONTACT_EMAIL||"rawdigitalworks@gmail.com";
